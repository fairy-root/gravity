<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <!--
      no-referrer is required for Starz/Medianova direct fetches: those CDNs
      403 when Referer is the Netlify app origin. Channel-specific Referer/UA
      still apply via the edge proxy (X-Stream-*). Amazon/aiv-cdn must use the
      proxy anyway (browser Origin alone causes HTTP 400 on those edges).
    -->
    <meta name="referrer" content="no-referrer" />
    <title>Gravity — Network Stream Player</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
